# Every push to main also publishes docs/ to Firebase Hosting (adventurers-tome.web.app),
# so the GitHub Pages copy and the Firebase copy are always the same site.
# Deploys with Firebase's own command-line tool at a fixed version (no third-party action), and the job can only
# read the repository.
name: Publish to Firebase Hosting
# It also checks every 10 minutes whether an admin changed the front page's tour video or its picture
# (Admin → Announce → Landing video), and publishes again only then, so link previews show the new one.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
# (one publish at a time; a check that comes up while one is running waits for it)
concurrency:
  group: hosting
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tour video and picture for link previews
        id: meta
        env:
          CHECK: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: node tools/landing-meta.js
      - name: Deploy
        if: ${{ github.event_name != 'schedule' || steps.meta.outputs.changed == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.34.0 deploy --only hosting --project dnd-character-sheets-b30c7 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

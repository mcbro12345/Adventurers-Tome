# Every push to main also publishes docs/ to Firebase Hosting (adventurers-tome.web.app),
# so the GitHub Pages copy and the Firebase copy are always the same site.
name: Publish to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dnd-character-sheets-b30c7
          channelId: live

# Publishes the invite-link worker (worker/) to Cloudflare whenever it changes. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers" permission) and CLOUDFLARE_ACCOUNT_ID.
name: Publish invite worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/invite-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Cloudflare secrets aren't set up yet; skipping."; exit 0; fi
          npx --yes wrangler@3.80.0 deploy

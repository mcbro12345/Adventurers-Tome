/* Profile pictures: no gold ring around them */

.pg-pres .pg-ava.me { box-shadow: 0 0 0 2px rgba(15,22,38,.95); }

/* Who's viewing: pictures sit side by side, not stacked over each other */
.pg-pres { gap: 4px; }

.pg-pres .pg-ava, .pg-pres .pg-ava.me { box-shadow: none; }
/* View-only links: the full logo across the top, linking to the lobby / sign in */
.pg-publogo { display: flex; justify-content: center; padding: 14px 16px 6px; text-decoration: none; position: relative; z-index: 2; }
.pg-publogo .hub-logo { display: inline-flex; align-items: center; gap: 10px; margin: 0; cursor: pointer; user-select: none; transition: transform .15s ease, filter .15s; }
.pg-publogo:hover .hub-logo { transform: scale(1.03); filter: brightness(1.1); }
.pg-publogo:active .hub-logo { transform: scale(.98); }
.pg-publogo .hl-d20 { width: 40px; height: 40px; flex: none; }
.pg-publogo .hl-txt { display: flex; flex-direction: column; line-height: 1; }
.pg-publogo .hl-a { font: 700 .62rem/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; letter-spacing: .4em; text-transform: uppercase; color: #c9962b; margin: 0 0 2px 2px; }
.pg-publogo .hl-t { font: italic 800 1.75rem/.95 Georgia, 'Times New Roman', serif; letter-spacing: .01em; background: linear-gradient(180deg, #f6e2a6 0%, #d9a93f 55%, #9c7124 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 4px; }
html.mobile .pg-publogo { padding-top: calc(10px + env(safe-area-inset-top)); }
html.mobile .pg-publogo .hl-d20 { width: 34px; height: 34px; }
html.mobile .pg-publogo .hl-t { font-size: 1.5rem; }
html.mobile.pg-public .pg-pubtag { position: static !important; display: block; width: fit-content; max-width: calc(100% - 32px); margin: 2px auto 0; transform: none !important; text-align: center; white-space: normal; }
html.mobile.pg-public .banner { padding-top: 4px !important; }
.pg-publogo { background: none; padding-top: 12px; }
.pg-publogo .hl-20 { fill: #f6e7bd; }
.pg-publogo .hl-d20 { transition: transform .6s cubic-bezier(.3,1.4,.5,1); overflow: visible; }
.pg-publogo .hl-d20.crit { filter: drop-shadow(0 0 5px rgba(80,230,120,.55)); }
.pg-publogo .hl-d20.fumble { filter: drop-shadow(0 0 5px rgba(230,80,80,.55)); }
html:not(.mobile).pg-public header.banner { padding-top: 0 !important; }
/* Computers: the logo takes the Adventurer's Tome button's spot in the header; the View only tag sits beside it */
.pg-publogo.pinned { position: absolute; padding: 0; z-index: 35; display: block; }
.pg-publogo.pinned .hub-logo { gap: 8px; }
.pg-publogo.pinned .hl-d20 { width: 32px; height: 32px; }
.pg-publogo.pinned .hl-a { font-size: .5rem; letter-spacing: .36em; margin-bottom: 1px; }
.pg-publogo.pinned .hl-t { font-size: 1.32rem; }
html.pg-public:not(.mobile):not(.pg-al) .pg-publogo.pinned { opacity: 0; pointer-events: none; }
html.pg-public.pg-al:not(.mobile) .pg-publogo.pinned { transition: opacity .2s; }
/* Phones: logo on the left, View only tag on the right, in one row across the top */
.pg-pubrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 16px 6px; }
html.mobile .pg-pubrow .pg-publogo { padding: 0; flex: none; }
html.mobile .pg-pubrow .pg-publogo .hl-d20 { width: 36px; height: 36px; }
html.mobile .pg-pubrow .pg-publogo .hl-a { font-size: .56rem; letter-spacing: .34em; }
html.mobile .pg-pubrow .pg-publogo .hl-t { font-size: 1.45rem; }
html.mobile.pg-public .pg-pubrow .pg-pubtag { margin: 0; max-width: 46%; font-size: 11.5px; line-height: 1.2; padding: 6px 12px; border-radius: 12px; text-align: center; }
/* Phones: the sheet header's top edge is one solid colour (the same one the browser bar above it uses), so the two meet
   without a seam; the soft glow sits lower down instead of at the very top. */
html.mobile header.banner { background: radial-gradient(ellipse 80% 90% at 28% 72%, color-mix(in srgb, #ffffff 7%, transparent) 0%, transparent 68%), linear-gradient(180deg, var(--navy) 0%, var(--navy) 18%, var(--navy2) 100%) !important; }
/* the logo has no pressed effect on phones (it fired while scrolling) */
html.mobile .pg-publogo .hub-logo, html.mobile .pg-publogo:active .hub-logo, html.mobile .pg-publogo:hover .hub-logo { transform: none !important; filter: none !important; transition: none !important; }
html.mobile .pg-publogo { -webkit-tap-highlight-color: transparent; }
html.mobile .pg-pubtag .pt-sub { display: block; font-weight: 600; font-size: .9em; opacity: .92; white-space: nowrap; }
html.mobile.pg-public .pg-pubrow .pg-pubtag { max-width: none; white-space: normal; }
/* the divider under Safari's bar on phones (shown once the page scrolls under it) */
.pg-topedge { position: fixed; left: 0; right: 0; top: 0; height: 1px; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .2s ease;
  background: color-mix(in srgb, var(--gold, #c9962b) 45%, transparent); box-shadow: 0 1px 0 rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.45); }
.pg-topedge.on { opacity: 1; }
/* desktop view-only logo: sized to the room above the toolbar (--plh is set by the page) */
.pg-publogo.pinned .hub-logo { gap: calc(var(--plh, 32px) * .26); height: var(--plh, 32px); }
.pg-publogo.pinned .hl-d20 { width: var(--plh, 32px); height: var(--plh, 32px); }
.pg-publogo.pinned .hl-a { font-size: calc(var(--plh, 32px) * .17); letter-spacing: .36em; margin-bottom: calc(var(--plh, 32px) * .04); }
.pg-publogo.pinned .hl-t { font-size: calc(var(--plh, 32px) * .66); line-height: .95; }
.pg-publogo.pinned { height: var(--plh, 32px); overflow: visible; }
.pg-publogo.pinned .hl-txt { justify-content: center; height: var(--plh, 32px); }
.pg-publogo.pinned .hl-d20 { width: calc(var(--plh, 32px) * 1.08); height: calc(var(--plh, 32px) * 1.08); margin: calc(var(--plh, 32px) * -.04) 0; }
.pg-publogo.pinned .hl-t { font-size: calc(var(--plh, 32px) * .7); }
.pg-publogo.pinned .hl-a { font-size: calc(var(--plh, 32px) * .18); }
/* The View only tag everywhere (public links and shared view-only sheets, phone and computer): "View only" with
   "(changes are not saved)" on a second, smaller line */
.pg-shared.view { border-radius: 12px !important; padding: 5px 12px !important; text-align: center; line-height: 1.2 !important; white-space: nowrap; font-size: 11.5px !important; }
.pg-shared.view .pt-sub { display: block; font-weight: 600; font-size: .9em; opacity: .92; white-space: nowrap; }

/* not enough room (phones, beside the Adventurer's Tome button and viewers): it shrinks to fit */
.pg-shared.view.wrap { white-space: nowrap !important; font-size: 9.5px !important; padding: 4px 9px !important; line-height: 1.15 !important; }
.pg-shared.view.wrap .pt-sub { white-space: nowrap; font-size: .92em; }

/* The Adventurer's Tome button, viewers, View only / shared tag and the view-only logo are part of the page: they stay
   put while a window is open, sitting underneath windows (50), the character wizard (40), menus and tooltips. */
.pg-hublink, .pg-shared, .pg-pres, .pg-publogo.pinned, .pg-topedge { z-index: 30 !important; }
/* Viewers bubble: snug around one picture, a little more room between several */
.pg-pres { gap: 6px !important; padding: 2px 6px 2px 2px !important; }
.pg-pres::after { margin-left: -1px !important; }
/* someone on a view-only link (not signed in) */
.pg-ava.anon { background: #4a5368; color: #d9dde6; display: inline-grid; place-items: center; }
/* phones, view-only link: the View only tag with who's viewing under it, on the right of the logo */
.pg-pubside { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; }
html.mobile .pg-pubside .pg-pres { position: static !important; transform: none !important; opacity: 1 !important; pointer-events: auto; }
/* phones, view-only link: pictures in the viewers bubble sit closer; the logo grows to match the taller right-hand side */
html.mobile .pg-pubside .pg-pres { gap: 3px !important; }
html.mobile .pg-pubrow .pg-publogo .hub-logo { gap: 8px; }
html.mobile .pg-pubrow .pg-publogo .hl-d20 { width: 58px; height: 58px; }
html.mobile .pg-pubrow .pg-publogo .hl-a { font-size: .62rem; letter-spacing: .28em; margin-bottom: 2px; }
html.mobile .pg-pubrow .pg-publogo .hl-t { font-size: 1.95rem; }
html.mobile .pg-pubrow .pg-publogo .hl-a { font-size: .58rem; letter-spacing: .22em; }
html.mobile .pg-pubrow .pg-publogo .hl-d20 { width: 72px; height: 72px; }
html.mobile .pg-pubrow .pg-publogo .hl-t { font-size: 2.35rem; }
html.mobile .pg-pubrow .pg-publogo .hl-a { font-size: .6rem; letter-spacing: .2em; margin: 0 0 3px 2px; }
html.mobile .pg-pubrow { gap: 8px; }
html.mobile .pg-pubrow .pg-publogo .hl-d20 { width: min(68px, 17vw); height: min(68px, 17vw); }
html.mobile .pg-pubrow .pg-publogo .hl-t { font-size: min(2.3rem, 9.4vw); }
html.mobile .pg-pubrow .pg-publogo .hl-a { font-size: min(.56rem, 2.3vw); letter-spacing: .16em; }
/* phones, view-only link: the logo is sized by the page to fill the space beside the tag (--mls = the die's size) */
html.mobile .pg-pubrow .pg-publogo .hub-logo { gap: calc(var(--mls, 60px) * .13); }
html.mobile .pg-pubrow .pg-publogo .hl-d20 { width: var(--mls, 60px); height: var(--mls, 60px); }
html.mobile .pg-pubrow .pg-publogo .hl-t { font-size: calc(var(--mls, 60px) * .54); }
html.mobile .pg-pubrow .pg-publogo .hl-a { font-size: calc(var(--mls, 60px) * .135); letter-spacing: .2em; margin: 0 0 calc(var(--mls, 60px) * .04) 2px; }
/* viewer pictures sit close together everywhere */
.pg-pres { gap: 3px !important; }
/* A message from the admin: a popup over everything */
#pg-msg { position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center; padding: 20px; background: rgba(6,9,16,.6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: pgmIn .2s ease; }
#pg-msg.out { opacity: 0; transition: opacity .18s ease; }
@keyframes pgmIn { from { opacity: 0; } to { opacity: 1; } }
#pg-msg .pgm-card { width: min(var(--pgm-w, 720px), 100%); max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; background: #182033; color: #ece4cf; border: 1px solid rgba(201,150,43,.55); border-radius: 16px; padding: 0; box-shadow: 0 24px 60px rgba(0,0,0,.5); font: 400 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; animation: pgmUp .24s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pgmUp { from { transform: translateY(14px) scale(.97); } to { transform: none; } }
#pg-msg .pgm-h { flex: none; display: flex; align-items: center; gap: 11px; padding: 18px 20px 12px; border-bottom: 1px solid rgba(201,150,43,.3); position: relative; z-index: 1; transition: box-shadow .15s ease; } /* the heading stays at the top */
#pg-msg .pgm-h b { display: block; font-size: 15.5px; } #pg-msg .pgm-h small { display: block; color: #9aa3b6; font-size: 12px; }

#pg-msg .pgm-row { flex: none; display: flex; justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid rgba(201,150,43,.3); position: relative; z-index: 1; transition: box-shadow .15s ease; } /* OK always in view */
#pg-msg .pgm-card.sc-t .pgm-h { box-shadow: 0 8px 14px -8px rgba(0,0,0,.4); }
#pg-msg .pgm-card.sc-b .pgm-row { box-shadow: 0 -8px 14px -8px rgba(0,0,0,.4); }
#pg-msg .pgm-ok { border: 0; border-radius: 10px; padding: 9px 22px; font: 700 14px system-ui, sans-serif; background: #c9962b; color: #1b1406; cursor: pointer; }

 html:where([data-pgtheme="light"]):not([data-pgtheme="dark"]) #pg-msg .pgm-card { background: #fffaf0; color: #2b2418; border-color: #d9b56a; } html:where([data-pgtheme="light"]):not([data-pgtheme="dark"]) #pg-msg .pgm-h small { color: #7a6f5c; } 
:where(body.hubbody, .wzh) .pm-anon { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; font-size: .92rem; } :where(body.hubbody, .wzh) .pm-anon .hub-hint { margin: 0; font-size: .8rem; }

}
// Send something to a character. If its sheet doesn't pick it up within a few seconds, it's applied to the saved copy.
function ptySend(fs, EMAIL, pid, to, kind, data, from, fromName, ref) {
  ref = ref || fs.collection('x').doc().id;
  return fs.collection('sheets').doc(to).collection('inbox').doc(ref).set({ p: pid, ref, from: from || '', fromName: String(fromName || '').slice(0, 80), by: EMAIL, at: Date.now(), kind, data: JSON.stringify(data || {}) })
    .then(() => { if (!(data && data.ask)) setTimeout(() => ptyDeliverClosed(fs, pid, to, ref, EMAIL, kind), 5000); return ref; }); // (ask-first ones wait for the player)
}
// Take back something sent: still waiting → simply removed; already applied → the character undoes exactly what it changed.
async function ptyRecall(fs, EMAIL, pid, to, ref, from, fromName) {
  const ib = fs.collection('sheets').doc(to).collection('inbox').doc(ref);
  try { const x = await ib.get(); if (x.exists) { await ib.delete(); return 'pulled'; } } catch (e) {}
  await ptySend(fs, EMAIL, pid, to, 'undo', { ref }, from, fromName); return 'undone';
}

  // ----- joining (an invite link, or an email invitation): 1. the invitation, 2. which character -----

            await PC.doc(p.id).update({ chars: FV.arrayUnion(c.id), people: FV.arrayUnion(c.owner), invited: FV.arrayRemove(c.owner), updatedAt: Date.now() });
            await PC.doc(p.id).collection('cards').doc(c.id).set(Object.assign({ owner: c.owner, name: c.name || '', race: c.race || '', cls: c.cls || '', level: c.level || 0, thumb: c.thumb || '', player: H.nameOf(c.owner || ''), path: c.path || '' }, pc || {}, { at: Date.now() }), { merge: true }).catch(() => {});
            await ptySetSheetParty(fs, c.id, p.id).catch(() => {});
            await ptyShareDM(fs, c.id, p.dm, Object.assign({ g: G }, sd)).catch(() => {});
            p.chars = (p.chars || []).concat([c.id]); g.textContent = 'Added'; pgLog('party_add', { target: p.id, tName: p.name, detail: c.name || c.id }); }
          catch (x) { b.disabled = false; g.textContent = 'Add'; fail(x, 'add it'); } }); } catch (x) { l.innerHTML = '<p class="hub-hint">Couldn’t search: ' + esc(x.message || x) + '</p>'; } };
    q.oninput = () => { clearTimeout(t); t = setTimeout(show, 200); }; show(); setTimeout(() => q.focus(), 30);
    modal.querySelector('#aa-x').onclick = close;
  }
  function adminTab(B, A) {
    const el = B(); A.HA().innerHTML = '';
    el.innerHTML = `<div class="adm-filters">${A.toolbar('ad-pq', 'Search by party, DM or character', A.PQ.v)}</div><div id="ad-pl"><div class="sk-auto" data-k="adm-parties-t"></div></div>`;
    const q = el.querySelector('#ad-pq'); let t = null; q.oninput = () => { clearTimeout(t); t = setTimeout(() => { A.PQ.v = q.value; adminPaint(B, A); }, 150); };
    if (!ALIVE) ALIVE = PC.limit(1000).onSnapshot(async qs => { AROWS = qs.docs.map(d => Object.assign({ id: d.id }, d.data())); await H.needNames(AROWS.map(p => p.dm)); if (A.isTab()) adminPaint(B, A); }, x => { const l = B().querySelector('#ad-pl'); if (l) l.innerHTML = A.failMsg(x); });
    else adminPaint(B, A);
  }
  const accessOf = p => p.dm === EMAIL ? 'dm' : (p.mgrs || []).includes(EMAIL) ? 'codm' : (p.people || []).includes(EMAIL) ? 'view' : '';
  function adminPaint(B, A) {
    const l = B() && B().querySelector('#ad-pl'); if (!l) return; if (A.busy()) return A.later(() => adminPaint(B, A));
    const qv = String(A.PQ.v || '').trim().toLowerCase();
    const rows = AROWS.filter(p => !qv || [p.name, p.dmName, H.nameOf(p.dm), p.dm].some(x => String(x || '').toLowerCase().includes(qv))).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const cnt = B().querySelector('#ad-pq-n'); if (cnt) cnt.textContent = rows.length + ' of ' + plural(AROWS.length, 'party').replace('partys', 'parties');
    l.innerHTML = rows.length ? `<div class="adm-tw"><table class="adm-t pt-t"><thead><tr><th>Party</th><th>DM</th><th>Characters</th><th>My access</th><th>Updated</th><th>Created</th><th></th></tr></thead><tbody>${rows.map(p => { const a = accessOf(p);
      return `<tr><td><a class="adm-char" href="${esc(URLS.party(p.id, p.name))}">${p.pic ? `<img class="hc-pic pty-admic" src="${esc(p.pic)}" alt="">` : `<span class="hc-pic hc-nopic pty-admic">${IC_PARTY}</span>`}<span><b>${esc(p.name || 'Unnamed party')}</b><small>${(p.invited || []).length ? plural(p.invited.length, 'invitation') + ' open' : plural((p.people || []).length, 'person').replace('persons', 'people')}</small></span></a></td>
        <td><button class="adm-who adm-dmbtn" data-pdm="${esc(p.id)}" title="Change the DM">${A.ava(H.nameOf(p.dm || ''), p.dm)}<span>${esc(p.dmName || H.nameOf(p.dm || '') || '—')}</span></button></td><td>${(p.chars || []).length}</td>
        <td>${a === 'dm' ? '<span class="adm-tag r-own">You’re the DM</span>' : `<select class="adm-sel" data-pacc="${esc(p.id)}" aria-label="My access"><option value="">None</option><option value="view"${a === 'view' ? ' selected' : ''}>In my list</option><option value="codm"${a === 'codm' ? ' selected' : ''}>Co-DM</option></select>`}</td>
        <td>${A.when(p.updatedAt)}</td><td>${A.when(p.createdAt)}</td><td class="adm-act">${A.kebab([['open', 'Open', p.id], ['add', 'Add a character…', p.id], ['dm', 'Change DM…', p.id], ['chatclear', 'Clear party chat…', p.id], ['del', 'Delete party…', p.id, 'danger']])}</td></tr>`; }).join('')}</tbody></table></div>` : `<p class="adm-empty">${AROWS.length ? 'No parties match.' : 'No parties yet.'}</p>`;
    l.querySelectorAll('[data-pacc]').forEach(sl => sl.onchange = async () => { const v = sl.value, ref = PC.doc(sl.dataset.pacc), p = AROWS.find(x => x.id === sl.dataset.pacc);
      try { await ref.update(v === 'codm' ? { people: FV.arrayUnion(EMAIL), mgrs: FV.arrayUnion(EMAIL) } : v ? { people: FV.arrayUnion(EMAIL), mgrs: FV.arrayRemove(EMAIL) } : { people: FV.arrayRemove(EMAIL), mgrs: FV.arrayRemove(EMAIL) });
        toast(v === 'codm' ? 'You’re now a co-DM of ' + (p.name || 'the party') + '.' : (p.name || 'The party') + (v ? ' is in your list.' : ' is out of your list.')); pgLog('party_access', { target: p.id, tName: p.name, detail: v === 'codm' ? 'made themselves co-DM' : v ? 'added it to their list' : 'took it off their list' }); }
      catch (x) { fail(x, 'change it'); sl.value = accessOf(p) === 'dm' ? '' : accessOf(p); } });
    l.querySelectorAll('[data-pdm]').forEach(b => b.onclick = () => { const p = AROWS.find(x => x.id === b.dataset.pdm); if (p) changeDM(p); });
    l.querySelectorAll('[data-mi]').forEach(b => b.onclick = () => { const p = AROWS.find(x => x.id === b.dataset.id); A.closeMenus(); if (!p) return; if (b.dataset.mi === 'open') pgGo(URLS.party(p.id, p.name)); if (b.dataset.mi === 'dm') changeDM(p); if (b.dataset.mi === 'add') adminAddChar(p); if (b.dataset.mi === 'chatclear') clearPartyChat(p); if (b.dataset.mi === 'del') deleteParty(p, () => adminPaint(B, A)); });
  }

  listen();
  return { saveOrder, paneHTML, count, loaded: () => LOADED, wirePane, partyPage, joinPage, adminTab, refresh: () => paint(), newParty: () => pgGo(URLS.party('new')) };
}
// ================= Window stacking =================
// Desktop: whichever window you click or tab into comes to the front. Floating windows (dice roller, party chat,
// turn order) trade places with pop-up windows (the sheet's windows and the lobby's) without lifting those pop-ups
// over their own menus and tips.
(() => {
  const FLOAT = '.drwin, .pcwin, .towin', POP = '#modal.open, .modal-bg.open, .hub-modal.on, .pg-out', H = document.documentElement;
  const front = w => {
    if (!w || H.classList.contains('mobile') || matchMedia('(max-width: 640px)').matches) return;
    if (w.matches(FLOAT)) {
      const fl = [...document.querySelectorAll(FLOAT)].filter(x => x !== w).sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0));
      fl.push(w); fl.forEach((x, i) => { x.style.zIndex = String(9001 + i); });
      H.classList.add('wfloat-front'); H.classList.remove('wpop-front');
    } else { H.classList.add('wpop-front'); H.classList.remove('wfloat-front'); }
  };
  const winOf = t => t && t.closest ? t.closest(FLOAT + ', ' + POP) : null;
  // Pressing the button that opened a window again closes it (site pop-ups; the sheet's own windows do this in app4.js)
  let lastSig = null, lastT = 0;
  const sigOf = el => el.id ? '#' + el.id : Object.keys(el.dataset).length ? 'd:' + JSON.stringify(el.dataset) : 'c:' + el.className + '|' + el.textContent.trim().slice(0, 40);
  const by = w => { if (lastSig && Date.now() - lastT < 1500) w.__by = lastSig; };
  const shut = w => { const c = w.querySelector(':scope > .pg-out-card, :scope > .hub-card') || w, x = c.querySelector(':scope > .mw-head .mw-x'); if (x) return x.click();
    const no = c.querySelector('.pg-out-no') || [...c.querySelectorAll('button')].find(b => /^(cancel|close|not now|done|no)$/i.test(b.textContent.trim()));
    if (no) return no.click(); document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); if (w.classList.contains('hub-modal')) w.classList.remove('on'); };
  addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button, a, [role=button], [data-act]');
    if (!b || b.closest(FLOAT + ', .pg-out, .hub-modal, #modal, #pg-msg')) { lastSig = null; return; }
    const sig = sigOf(b), open = [...document.querySelectorAll('.pg-out, .hub-modal.on')].find(w => w.__by === sig && !w.classList.contains('closing'));
    if (open) { e.stopImmediatePropagation(); e.preventDefault(); shut(open); lastSig = null; return; }
    lastSig = sig; lastT = Date.now();
  }, true);
  addEventListener('pointerdown', e => front(winOf(e.target)), true);
  addEventListener('focusin', e => front(winOf(e.target)), true);
  // a window that has just opened starts in front
  const seen = new WeakSet();
  new MutationObserver(ms => { for (const m of ms) {
    if (m.type === 'childList') m.addedNodes.forEach(n => { if (n.nodeType === 1 && n.matches(FLOAT + ', .pg-out')) { front(n); by(n); } });
    else { const t = m.target; if (t.matches && t.matches('.modal-bg.open, .hub-modal.on')) { if (!seen.has(t)) { seen.add(t); front(t); by(t); } } else if (t.classList) seen.delete(t); }
  }
    if (H.classList.contains('wpop-front') && !document.querySelector('.modal-bg.open:not(.closing), .hub-modal.on:not(.closing), .pg-out:not(.closing)')) H.classList.remove('wpop-front');
  }).observe(document.body || document.documentElement, { childList: true, attributes: true, attributeFilter: ['class'], subtree: true });
})();

// The logo goes back to the lobby from every page that shows it (in the lobby itself, its die still rolls); middle-click opens a new tab
(() => { const LOGO = '.hub-logo, .dk-logo';
  const away = () => document.body && !document.body.classList.contains('hubbody') || !!document.querySelector('#wizard.open, .pw, .adm, #pg-desk');
  const go = (e, tab) => { const l = e.target.closest && e.target.closest(LOGO); if (!l || !window.PG_HUBU || !away()) return; e.preventDefault(); e.stopImmediatePropagation(); if (tab || e.ctrlKey || e.metaKey) window.open(window.PG_HUBU, '_blank'); else pgGo(window.PG_HUBU); };
  document.addEventListener('click', e => go(e, false), true);
  document.addEventListener('auxclick', e => { if (e.button === 1) go(e, true); }, true);
  document.addEventListener('mouseover', e => { const l = e.target.closest && e.target.closest(LOGO); if (l && away()) { l.style.cursor = 'pointer'; l.title = 'Back to the lobby'; } }, true);
})();

// Right-click a character, party or member tile: its ⋯ menu opens right where you clicked (with "Open in a new tab" for
// tiles that link somewhere). The ⋯ button still opens it in its usual spot.
(() => { if (window.__pgTileCtx) return; window.__pgTileCtx = 1;
  const TILE = '.hr, .hc, .pm';
  document.addEventListener('contextmenu', e => {
    if (e.shiftKey || !e.target.closest || e.target.closest('input, textarea, [contenteditable]')) return;
    const t = e.target.closest(TILE); if (!t) return; const m = t.querySelector('.hc-menu'); if (!m || !t.contains(m)) return;
    e.preventDefault();
    document.querySelectorAll('.hc-menu.on').forEach(x => { if (x !== m) x.classList.remove('on', 'pt'); });
    const list = m.querySelector('.hc-list'); if (!list) return;
    list.querySelectorAll('.hc-ctxonly').forEach(x => x.remove());
    const a = t.querySelector('a[href]'); if (a) { const nb = document.createElement('button'); nb.className = 'hc-ctxonly'; nb.type = 'button'; nb.innerHTML = '<svg class="mi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open in a new tab'; nb.onclick = ev => { ev.stopPropagation(); m.classList.remove('on', 'pt'); window.open(a.href, '_blank', 'noopener'); }; list.prepend(nb); }
    m.classList.add('on', 'pt'); m.style.setProperty('--px', e.clientX + 'px'); m.style.setProperty('--py', e.clientY + 'px');
    requestAnimationFrame(() => { const r = list.getBoundingClientRect(); m.style.setProperty('--px', Math.max(8, Math.min(e.clientX, innerWidth - r.width - 8)) + 'px'); m.style.setProperty('--py', Math.max(8, Math.min(e.clientY, innerHeight - r.height - 8)) + 'px'); });
  });
  // the ⋯ button (or anything that closes the menu) puts it back in its usual spot
  document.addEventListener('pointerdown', e => { const d = e.target.closest && e.target.closest('.hc-dots'); document.querySelectorAll('.hc-menu.pt').forEach(m => { if (d && m.contains(d)) { m.classList.remove('pt'); m.querySelectorAll('.hc-ctxonly').forEach(x => x.remove()); } else if (!m.contains(e.target)) { m.classList.remove('on', 'pt'); m.querySelectorAll('.hc-ctxonly').forEach(x => x.remove()); } }); }, true);
  addEventListener('scroll', () => document.querySelectorAll('.hc-menu.pt').forEach(m => m.classList.remove('on', 'pt')), true);
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zeke — Character Sheet</title>
<script>
  (function () {
    try { var u = JSON.parse(localStorage.getItem('dnd-sheet-ui') || '{}'); var m = u.layout ? u.layout === 'mobile' : window.innerWidth < 640; if (m) document.documentElement.classList.add('mobile'); } catch (e) {}
    var t = null;
    try { t = localStorage.getItem('dnd-sheet-theme'); } catch (e) {}
    if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root {
  /* Palette pulled from Zeke's mini: ivory tunic, golden cape, brass hilt,
     slate-blue leather, navy trim, misty teal-grey sky. */
  --bg: #E6E4DC;
  --bg2: #D5DEDB;
  --panel: #FBF8F1;
  --panel2: #F2EDE1;
  --field: #FFFFFF;
  --ink: #1D2536;
  --soft: #56627A;
  --line: #D3CAB6;
  --line2: #E6DECD;
  --gold: #E0A526;
  --gold-ink: #8F620E;
  --gold-soft: #F6E7BF;
  --slate: #66768A;
  --navy: #26304A;
  --navy2: #1A2236;
  --banner-ink: #F4EEDF;
  --red: #A63A2C;
  --red-soft: #F5DCD6;
  --green: #3D7653;
  --shadow: 0 1px 2px rgba(29,37,54,.08), 0 6px 18px rgba(29,37,54,.07);
  --temp: #5CC8FF; --temp-ink: #0B79B5; --temp-soft: #E3F5FF;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #10151E;
  --bg2: #18212C;
  --panel: #1A212E;
  --panel2: #222A3A;
  --field: #141A25;
  --ink: #ECE5D4;
  --soft: #A3ACBE;
  --line: #34405A;
  --line2: #2A3346;
  --gold: #E3A933;
  --gold-ink: #EDBC57;
  --gold-soft: #3A311C;
  --slate: #8E9BB1;
  --navy: #0F1523;
  --navy2: #0A0E18;
  --banner-ink: #F1EADA;
  --red: #E58371;
  --red-soft: #3D2522;
  --green: #7FC79C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
  --temp: #6FD3FF; --temp-ink: #8FDDFF; --temp-soft: #12304A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  background: linear-gradient(180deg, var(--bg2) 0, var(--bg) 420px) fixed, var(--bg);
  min-height: 100vh;
}
h1, h2, h3, .cinzel { font-family: Arial, Helvetica, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }

/* ---------- Banner ---------- */
.banner {
  background:
    radial-gradient(1200px 300px at 15% -40%, rgba(224,165,38,.22), transparent 60%),
    linear-gradient(180deg, var(--navy) 0, var(--navy2) 100%);
  color: var(--banner-ink);
  border-bottom: 3px solid var(--gold);
  box-shadow: inset 0 -6px 0 -3px rgba(244,238,223,.18);
}
.banner .wrap { padding-top: 18px; padding-bottom: 18px; display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; }
.portrait-wrap { position: relative; width: 148px; height: 148px; border-radius: 14px; overflow: hidden;
  border: 3px solid var(--gold); box-shadow: 0 0 0 3px rgba(244,238,223,.25), 0 8px 24px rgba(0,0,0,.35); background: #6d7c80; }
.portrait-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
.portrait-edit { position: absolute; inset: auto 0 0 0; text-align: center; font-size: 12px; font-weight: 600; padding: 4px;
  background: rgba(15,21,35,.72); color: #F4EEDF; opacity: 0; transition: opacity .15s; cursor: pointer; }
.portrait-wrap:hover .portrait-edit, .portrait-edit:focus-within { opacity: 1; }
.ident { min-width: 0; }
.ident-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.banner .f { color: var(--banner-ink); border-bottom-color: rgba(244,238,223,.25); }
.banner .f:focus { background: rgba(255,255,255,.08); }
.f.name { font-family: Arial, Helvetica, sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: .01em; line-height: 1.1; padding: 0 4px; max-width: 520px; }
.subtitle { font-size: .95rem; opacity: .85; margin: 2px 4px 10px; }
.ident-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.banner .lbl { color: var(--gold); }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tbtn { background: rgba(244,238,223,.08); border: 1px solid rgba(244,238,223,.22); color: var(--banner-ink);
  border-radius: 8px; padding: 6px 11px; font-weight: 600; font-size: .88rem; display: inline-flex; gap: 6px; align-items: center; }
.tbtn:hover { background: rgba(244,238,223,.16); }
.tbtn.gold { background: var(--gold); color: #1D2536; border-color: var(--gold); }
.tbtn.gold:hover { filter: brightness(1.06); }
.tbtn svg { width: 16px; height: 16px; }
.save-state { font-size: .78rem; opacity: .7; margin-left: 4px; min-width: 70px; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 230px; z-index: 30; display: none; }
.menu.open .menu-list { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; }
.menu-list button:hover { background: var(--panel2); }
.menu-list small { display: block; color: var(--soft); font-size: .78rem; }

/* ---------- Generic fields ---------- */
.lbl { display: block; font-family: Arial, Helvetica, sans-serif; font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 1px; }
.fld { display: block; min-width: 0; }
.f { font: inherit; color: var(--ink); background: transparent; border: 1px solid transparent; border-bottom: 1px dashed var(--line);
  border-radius: 4px; padding: 3px 5px; width: 100%; min-width: 0; transition: background .12s, border-color .12s; }
.f:hover { border-bottom-color: var(--slate); }
.f:focus { outline: 2px solid var(--gold); outline-offset: 0; background: var(--field); border-color: transparent; }
.f.c { text-align: center; }
.f.num { width: 64px; }
.f.sm { width: 48px; text-align: center; }
textarea.f { resize: vertical; min-height: 34px; line-height: 1.5; border: 1px dashed var(--line); padding: 6px 8px; overflow: hidden; }
select.f { cursor: pointer; padding-right: 2px; }
select.f option { background: var(--panel); color: var(--ink); }
input[type=number].f { -moz-appearance: textfield; appearance: textfield; }
input[type=number].f::-webkit-inner-spin-button, input[type=number].f::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
table.grid select.f { min-width: 66px; }
.death .pips { flex-wrap: nowrap; }
input[type=checkbox] { accent-color: var(--gold); width: 16px; height: 16px; cursor: pointer; margin: 0; }

.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; font-weight: 600; font-size: .86rem; color: var(--ink); }
.btn:hover { border-color: var(--slate); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1D2536; }
.btn.red { color: var(--red); }
.btn.ghost { background: transparent; }
.icon-btn { background: transparent; border: 0; color: var(--soft); padding: 4px 6px; border-radius: 6px; line-height: 1; font-size: 1rem; }
.icon-btn:hover { color: var(--red); background: var(--red-soft); }
.icon-btn.mv:hover { color: var(--ink); background: var(--panel2); }

/* ---------- Panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.panel > h2, .ph { font-size: .9rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); margin: 0 0 10px;
  display: flex; align-items: center; gap: 8px; }
.ph .grow, .panel > h2 .grow { flex: 1; }
.ph::before, .panel > h2::before { content: ""; width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); flex: none; }
.hint { color: var(--soft); font-size: .82rem; }
.muted { color: var(--soft); }

/* ---------- Vitals ---------- */
.vitals { display: grid; grid-template-columns: minmax(370px, 1.7fr) repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); text-align: center; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.tile .big { font-size: 1.7rem; font-weight: 700; line-height: 1.1; font-family: Arial, Helvetica, sans-serif; }
.tile .f.big { font-size: 1.7rem; font-weight: 700; text-align: center; font-family: Arial, Helvetica, sans-serif; padding: 0; }
.tile .sub { font-size: .75rem; color: var(--soft); }
.tile.ac { border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), var(--panel) 75%); }
.hp { grid-row: span 2; text-align: left; justify-content: center; }
.hp-row { display: flex; align-items: baseline; gap: 6px; }
.hp-row .f.cur { font-size: 2.4rem; width: 90px; font-family: Arial, Helvetica, sans-serif; font-weight: 700; text-align: right; padding: 0 4px; }
.hp-row .f.max { font-size: 1.3rem; width: 64px; font-weight: 600; padding: 0 4px; }
.hp-row .slash { font-size: 1.4rem; color: var(--soft); }
.hp-row .temp { margin-left: auto; text-align: center; }
.hp-row .temp .f { width: 56px; text-align: center; font-size: 1.2rem; font-weight: 600; }
.hp-wrap { display: flex; gap: 16px; align-items: center; }
.hp-ring { position: relative; width: 140px; height: 140px; flex: none; }
.ring-svg, .ring-svg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring-svg svg { transform: rotate(-90deg); }
.ring-svg circle { fill: none; stroke-width: 10; }
.ring-svg .rt { stroke: var(--line2); }
.ring-svg .rf { stroke: var(--gold); stroke-linecap: round; transition: stroke-dasharray .35s; }
.ring-svg .rf.low { stroke: #C9573F; }
.ring-svg .rtmp { stroke: var(--temp); stroke-linecap: round; filter: drop-shadow(0 0 3px var(--temp)); }
.hp-side .temp .lbl { color: var(--temp-ink); }
.hp-side .temp .f { color: var(--temp-ink); border-color: var(--temp) !important; background: var(--temp-soft) !important; }
.hp-center { position: absolute; inset: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hp-center .f.cur { font-size: 2.3rem; font-weight: 700; width: 86px; text-align: center; padding: 0; border-bottom-color: transparent; line-height: 1.05; }
.hp-max { font-size: .8rem; color: var(--soft); display: flex; align-items: center; gap: 2px; }
.hp-max .f.max { width: 44px; font-weight: 700; font-size: .95rem; text-align: center; padding: 0; }
.hp-side { flex: 1; min-width: 0; display: grid; gap: 10px; }
.hp-side .temp { display: flex; align-items: center; gap: 8px; }
.hp-side .temp .lbl { margin: 0; }
.hp-side .temp .f { width: 64px; font-size: 1.15rem; font-weight: 700; text-align: center; border: 1px solid var(--line); background: var(--field); }
.hp-side .hp-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hp-side .hp-actions input { grid-column: 1 / -1; width: 100%; }
.hp-side .hp-actions .btn { width: 100%; }
.hpbar { height: 10px; border-radius: 6px; background: var(--line2); overflow: hidden; margin: 6px 0 10px; display: flex; }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #F0C35A); transition: width .25s; }
.hpbar i.low { background: linear-gradient(90deg, #B84A35, #D9734F); }
.hpbar b { display: block; height: 100%; background: var(--temp); }
.hp-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.hp-actions input { width: 82px; }
.hp-actions .f { border: 1px solid var(--line); background: var(--field); }
.wide2 { grid-column: 2 / -1; }
.vitals .status-tile { flex-direction: row; flex-wrap: wrap; gap: 6px 24px; }
.vitals .status-tile .row { flex: 1 1 280px; }
.status-tile { text-align: left; gap: 6px; }
.status-tile .row { display: flex; gap: 8px; align-items: center; }
.status-tile .row .lbl { width: 116px; flex: none; margin: 0; }

.pips { display: inline-flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pip { width: 18px; height: 18px; border: 2px solid var(--gold-ink); background: var(--gold); transform: rotate(45deg) scale(.82); border-radius: 3px; padding: 0; }
.pip.spent { background: transparent; border-color: var(--slate); opacity: .65; }
.pip.dot { transform: none; border-radius: 50%; }
.pip.fail { border-color: var(--red); background: var(--red); }
.pip.fail.spent { background: transparent; border-color: var(--slate); }
.death { display: grid; grid-template-columns: 1fr; gap: 2px; justify-items: center; align-items: center; font-size: .78rem; color: var(--soft); }
.down .death { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; box-shadow: inset 0 -2px 0 var(--line); margin: 6px 0 16px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 10px 14px; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: .9rem; letter-spacing: .02em;
  color: var(--soft); border-bottom: 3px solid transparent; white-space: nowrap; flex: none; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--gold); }
.page { display: none; }
.page.on { display: block; }

/* ---------- Core ---------- */
.core { display: grid; grid-template-columns: minmax(300px, 1.05fr) minmax(260px, .9fr) minmax(320px, 1.3fr); gap: 14px; align-items: start; }
.abilities { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ab { border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 10px; text-align: center; background: var(--panel2); }
.ab .lbl { text-align: center; }
.ab .modbtn { display: grid; place-items: center; margin: 4px auto; width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--gold);
  background: var(--panel); font-family: Arial, Helvetica, sans-serif; font-size: 1.45rem; font-weight: 700; }
.ab .score { width: 54px; margin: 0 auto; text-align: center; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.ab .saverow { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: .82rem; color: var(--soft); }
.roll { background: none; border: 0; padding: 0 3px; border-radius: 5px; font-weight: 700; color: var(--ink); }
.roll:hover { background: var(--gold-soft); color: var(--gold-ink); }
.ab .modbtn:hover { background: var(--gold-soft); }
.skills { display: grid; gap: 1px; }
.sk { display: grid; grid-template-columns: 22px 38px 1fr 32px 40px; align-items: center; gap: 4px; padding: 2px 0; border-bottom: 1px solid var(--line2); font-size: .92rem; }
.sk:last-child { border-bottom: 0; }
.sk .ab3 { font-size: .7rem; color: var(--soft); text-transform: uppercase; text-align: center; }
.sk .sknote { grid-column: 3 / -1; font-size: .75rem; color: var(--soft); margin-top: -3px; }
.profbtn { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--slate); background: transparent; padding: 0; }
.profbtn.p1 { background: var(--gold); border-color: var(--gold-ink); }
.profbtn.p2 { background: var(--gold); border-color: var(--gold-ink); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--gold); }
.sk .f.sm { font-size: .8rem; padding: 1px; }
.passive { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-weight: 600; }

table.grid { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.grid th { text-align: left; font-family: Arial, Helvetica, sans-serif; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); font-weight: 600; padding: 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 3px 3px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: 0; }
.scrollx { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.calc { font-weight: 700; white-space: nowrap; }
.stack { display: grid; gap: 14px; }
.profgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }

/* ---------- Spells ---------- */
.spell-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
.spell-top .tile { box-shadow: none; background: var(--panel2); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel2); }
.slot .top { display: flex; justify-content: space-between; align-items: baseline; }
.slot .lbl { margin: 0; }
.slot .ct { font-size: .8rem; color: var(--soft); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 14px 0 8px; }
.chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 4px 12px; font-size: .84rem; font-weight: 600; }
.chip.on { background: var(--navy); color: var(--banner-ink); border-color: var(--navy); }
:root[data-theme="dark"] .chip.on { background: var(--gold); color: #1D2536; border-color: var(--gold); }
table.spells { min-width: 980px; }
table.spells td .f { padding: 2px 3px; }
tr.lvlhead td { background: var(--panel2); font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: .78rem; letter-spacing: .12em; color: var(--gold-ink); text-transform: uppercase; padding: 6px 8px; }
tr.unprep td:not(:first-child) { opacity: .62; }
tr.unprep:hover td, tr.unprep:focus-within td { opacity: 1; }
.tag { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--soft); margin-left: 3px; vertical-align: middle; }
.tag.oath { background: var(--gold-soft); color: var(--gold-ink); border-color: var(--gold); }
tr.detail td { background: var(--panel2); padding: 10px 12px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 14px; margin-bottom: 8px; align-items: end; }
.checkline { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; }

/* ---------- Features ---------- */
.feats { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.feat { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.feat-head { display: flex; gap: 6px; align-items: center; }
.feat-head .f.title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 1.02rem; }
.feat-uses { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 6px 8px; border-radius: 8px; background: var(--panel2); font-size: .84rem; }
.feat-uses .f { width: 92px; font-size: .84rem; }
.feat-uses select.f { width: 104px; }
.pool { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.pool .f { width: 64px; text-align: center; font-size: 1rem; font-weight: 700; border: 1px solid var(--line); background: var(--field); }

/* ---------- Inventory ---------- */
.inv { display: grid; grid-template-columns: minmax(260px, .8fr) 2fr; gap: 14px; align-items: start; }
.coins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.coin { text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; background: var(--panel2); }
.coin .f { text-align: center; font-weight: 700; font-size: 1.05rem; }
.coin.gp { border-color: var(--gold); background: var(--gold-soft); }
.coin .adj { display: flex; gap: 2px; justify-content: center; margin-top: 2px; }
.coin .adj button { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; font-size: .74rem; padding: 0 5px; }
.enc { margin-top: 10px; }
.enc .bar { height: 8px; background: var(--line2); border-radius: 5px; overflow: hidden; margin-top: 4px; }
.enc .bar i { display: block; height: 100%; background: var(--slate); }
table.items { min-width: 480px; }
tr.unequipped .f.iname { color: var(--soft); }

/* ---------- Story ---------- */
.story { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.traits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.rumor { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel2); margin-bottom: 10px; display: grid; gap: 6px; }
.rumor-head { display: flex; gap: 6px; align-items: center; }
.rumor-head select { width: 132px; flex: none; font-weight: 700; }
.rumor-head .f.title { font-weight: 700; font-family: Arial, Helvetica, sans-serif; }
.kind-True { color: var(--green); }
.kind-False { color: var(--red); }
.kind-Exaggerated { color: var(--gold-ink); }

/* ---------- Combat ---------- */
.combat { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.cs-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
.cs-item:last-of-type { border-bottom: 0; }
.cs-item .f.title { font-weight: 700; }
.cs-item textarea { grid-column: 1 / -1; }

.turnbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; border-top-width: 1px; }
.round { display: flex; align-items: center; gap: 6px; }
.round .lbl { margin: 0 4px 0 0; }
.round b { font-size: 1.6rem; min-width: 34px; text-align: center; }
.turnbar .hint { flex: 1 1 300px; }
.economy { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.econ { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; transition: opacity .15s; }
.econ.col-action { border-top: 4px solid var(--gold); }
.econ.col-bonus { border-top: 4px solid var(--slate); }
.econ.col-reaction { border-top: 4px solid var(--red); }
.econ.col-move { border-top: 4px solid var(--green); }
.econ-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); }
.econ-head h3 { margin: 0; font-size: 1.02rem; flex: 1; }
.badge { flex: none; width: 14px; height: 14px; }
.b-action { background: var(--gold); border-radius: 50%; }
.b-bonus { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid var(--slate); }
.b-reaction { width: 11px; height: 11px; background: var(--red); transform: rotate(45deg); border-radius: 2px; }
.b-move { background: var(--green); border-radius: 3px; }
.pill { border: 1.5px solid var(--green); color: var(--green); background: transparent; border-radius: 999px; padding: 2px 12px; font-size: .78rem; font-weight: 700; min-width: 64px; }
.econ.used .pill { border-color: var(--soft); color: var(--soft); background: var(--line2); }
.econ.used .econ-body { opacity: .45; }
.econ.used .econ-body:hover { opacity: .8; }
.econ-body { padding: 8px 12px 6px; display: grid; gap: 4px; }
.econ-foot { padding: 6px 12px 10px; display: flex; gap: 6px; justify-content: flex-end; }
.sect { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); font-weight: 700; display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.sect .grow { flex: 1; }
.block { border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px 8px; background: var(--panel2); margin-bottom: 4px; }
.block .sect { margin-top: 0; }
table.mini { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 2px; }
table.mini td { padding: 3px 2px; border-bottom: 1px solid var(--line2); }
table.mini td:not(:first-child) { text-align: right; white-space: nowrap; }
table.mini tr:last-child td { border-bottom: 0; }
.smite { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
.smite-btn[disabled] { opacity: .4; cursor: default; }
.opt { padding: 7px 0; border-bottom: 1px solid var(--line2); }
.opt:last-child { border-bottom: 0; }
.opt.edit { display: grid; gap: 4px; }
.opt-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.opt-name { font-weight: 700; flex: 1; min-width: 90px; }
.opt-head .f.title { flex: 1; font-weight: 700; }
.opt-head .pips .pip { width: 15px; height: 15px; }
.opt-head .pool .f { width: 52px; font-size: .9rem; }
.opt-text { font-size: .84rem; color: var(--soft); margin-top: 2px; }
.btn.sm { padding: 2px 9px; font-size: .78rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 6px; }
.atkbtn { white-space: nowrap; }
.tbtn[disabled] { opacity: .4; cursor: default; }
.equipped-list { display: grid; gap: 2px; }
.eq-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line2); }
.eq-row:last-child { border-bottom: 0; }
.eq-row .f.iname { font-weight: 700; }
.eq-row .f.eqnote { grid-column: 1 / -1; font-size: .84rem; color: var(--soft); }
.eq-row .ctl { display: flex; align-items: center; gap: 2px; }
.hist { list-style: none; padding: 0; margin: 10px 0 0; max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.hist li { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line2); margin: 0; font-size: .88rem; }
.hist li:last-child { border-bottom: 0; }
.hist .tm { color: var(--soft); font-variant-numeric: tabular-nums; font-size: .8rem; }
.hist .redo { opacity: .55; font-style: italic; }
.rb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.movemeter { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.mbar { height: 8px; background: var(--line2); border-radius: 5px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--green); transition: width .2s; }
.mtext { font-size: .8rem; color: var(--soft); text-align: center; margin-top: 3px; }
@media (max-width: 1100px) { .economy { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .economy { grid-template-columns: 1fr; } }

/* ---------- Notes ---------- */
.note { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); margin-bottom: 10px; box-shadow: var(--shadow); }
.note-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.note-head input[type=date] { width: 150px; flex: none; }
.note-head .f.title { font-weight: 700; font-family: Arial, Helvetica, sans-serif; }

/* ---------- Modal / toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10,14,24,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 12px; max-width: 520px; width: 100%; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: calc(100vh - 32px); overflow: auto; }
.modal h3 { margin: 0 0 8px; font-size: 1.2rem; }
.modal ul { padding-left: 18px; margin: 8px 0; }
.modal li { margin: 3px 0; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.modal .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.modal .f { border: 1px solid var(--line); background: var(--field); }
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--navy); color: var(--banner-ink); border-left: 4px solid var(--gold); border-radius: 8px; padding: 9px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: .9rem; display: flex; gap: 10px; align-items: center; animation: tin .2s ease-out; }
:root[data-theme="dark"] .toast { background: #2A3347; }
.toast b.total { font-family: Arial, Helvetica, sans-serif; font-size: 1.35rem; color: var(--gold); min-width: 34px; text-align: center; }
.toast .det { font-size: .78rem; opacity: .75; }
.toast button { margin-left: auto; background: transparent; border: 1px solid rgba(244,238,223,.35); color: inherit; border-radius: 6px; padding: 2px 8px; font-size: .8rem; }
.toast.crit b.total { color: #7FE0A5; }
.toast.fumble b.total { color: #FF9A85; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .core { grid-template-columns: 1fr 1fr; }
  .core > .col3 { grid-column: 1 / -1; }
  .inv, .story { grid-template-columns: 1fr; }
}
.ac-fx { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
.ac-fx:empty { display: none; }
.fx { font-size: .72rem; font-weight: 700; background: var(--gold-soft); color: var(--gold-ink); border: 1px solid var(--gold); border-radius: 999px; padding: 1px 2px 1px 8px; display: inline-flex; gap: 2px; align-items: center; }
.fx button { border: 0; background: none; color: inherit; padding: 2px 6px; font-weight: 700; }
.tile.ac.boosted .big { color: var(--gold-ink); }
.tile.ac .f.big { width: 100%; }
.tile.ac .sub .f.sm { width: 44px; }
.always { font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gold-ink); background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 999px; padding: 2px 7px; white-space: nowrap; }
.prep-tile .sub { font-size: .7rem; }
.prep-tile.over .big { color: var(--red); }
.btn[disabled] { opacity: .35; cursor: not-allowed; filter: grayscale(1); }
.inv-panel .coins { margin-bottom: 14px; max-width: 560px; }
.inv2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.inv-col { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel2); min-width: 0; }
.inv-col.eqcol { border-color: var(--gold); }
.subh { margin: 0 0 8px; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.subh .count { font-size: .75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--soft); }
.item { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; display: grid; gap: 4px; }
.item-top, .item-bot { display: flex; align-items: center; gap: 6px; }
.item .f.iname { font-weight: 700; flex: 1; }
.item .f.inote { flex: 1; font-size: .85rem; color: var(--soft); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.qty button { border: 0; background: var(--panel2); width: 26px; height: 26px; font-weight: 700; }
.qty .f.qtyin { width: 38px; text-align: center; border: 0; border-radius: 0; padding: 2px 0; }
.movebtn { white-space: nowrap; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 12px; position: sticky; top: 46px; z-index: 18; box-shadow: var(--shadow); }
.seg-btn { border: 0; background: transparent; border-radius: 9px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: .8rem; color: var(--soft); position: relative; min-height: 54px; }
.seg-btn.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.seg-btn .dot { position: absolute; top: 6px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
.seg-btn .dot.used { background: var(--soft); opacity: .45; }
.opt-tog { background: none; border: 0; padding: 4px 0; text-align: left; font-weight: 700; color: var(--ink); }
.caret { color: var(--soft); font-size: .8em; }
.atk-cards { display: grid; gap: 8px; }
.atk-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel2); }
.atk-top { display: flex; align-items: center; gap: 8px; }
.atk-name { flex: 1; text-align: left; background: none; border: 0; font-weight: 700; font-size: 1.02rem; padding: 6px 0; color: var(--ink); }
.atk-stats { display: flex; gap: 14px; align-items: center; font-size: .92rem; margin: 2px 0; }
.atk-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.sp-list { display: grid; gap: 6px; }
.lvl-label { font-weight: 700; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink); margin: 10px 0 2px; }
.sp-card { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 8px; background: var(--panel); }
.sp-card.unprep { background: var(--panel2); }
.sp-card.unprep .sp-name { color: var(--soft); }
.sp-top { display: flex; align-items: center; gap: 8px; }
.sp-name { flex: 1; text-align: left; background: none; border: 0; font-weight: 700; font-size: 1rem; padding: 8px 0; color: var(--ink); }
.sp-meta { font-size: .82rem; color: var(--soft); }
.sp-detail { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.prepbox { display: inline-flex; padding: 4px; cursor: pointer; }
@media (max-width: 900px) { html:not(.mobile) .inv2, html:not(.mobile) .cstrip { grid-template-columns: 1fr; } }

/* attack pips + smite */
.atkpips { display: inline-flex; gap: 4px; align-items: center; }
.ap { width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid var(--slate); border-radius: 2px; opacity: .55; }
.ap.on { background: var(--gold); border-color: var(--gold-ink); opacity: 1; }
.atk-foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line2); }
.atk-foot .hint { flex: 1 1 220px; }
.toggle { border: 1.5px solid var(--line); background: transparent; color: var(--soft); border-radius: 999px; padding: 3px 10px; font-size: .74rem; font-weight: 700; text-transform: none; letter-spacing: 0; }
.toggle::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; margin-right: 6px; vertical-align: 0; }
.toggle.on { background: var(--gold-soft); color: var(--gold-ink); border-color: var(--gold); }
.toggle.on::before { background: var(--gold); border-color: var(--gold-ink); }
.smite-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; width: 100%; }
.smite-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.smite-btn b { font-size: .95rem; }
.smite-btn span { font-size: .68rem; color: var(--soft); }
.smite-btn:hover:not([disabled]) { border-color: var(--gold); background: var(--gold-soft); }
.smite-btn[disabled] { opacity: .35; cursor: not-allowed; }
/* active effects */
.status-tile .fxrow { align-items: flex-start; }
.fxchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 26px; }
.fxc { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 2px 2px 2px 10px; font-size: .8rem; }
.fxc.conc { border-color: var(--gold); }
.fxc .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.fxc .left { color: var(--soft); font-variant-numeric: tabular-nums; }
.fxc.ending { border-color: var(--red); }
.fxc.ending .left { color: var(--red); font-weight: 700; }
.fxc button { border: 0; background: none; color: var(--soft); padding: 2px 7px; border-radius: 999px; }
.fxc button:hover { color: var(--red); }
.fxchips.big .fxc { font-size: .9rem; padding: 4px 4px 4px 12px; }
.toast.alert { border-left-color: #E58371; }
.cstrip { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 12px; margin-bottom: 12px; }
.cstrip .panel { padding: 12px 14px; }
.cstrip h2 { margin-bottom: 8px; flex-wrap: wrap; }
.timebtns { display: inline-flex; gap: 4px; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 400; }
.slotline { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 3px 0; }
.slotline .sl { font-weight: 700; font-size: .8rem; color: var(--gold-ink); }
.slotline .ct { font-size: .8rem; color: var(--soft); font-variant-numeric: tabular-nums; }
/* macros */
.modal.wide { max-width: 760px; }
.mtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.mtools #mq { flex: 1 1 200px; }
.segmini { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.segmini button { border: 0; background: var(--panel2); padding: 6px 10px; font-size: .8rem; font-weight: 700; color: var(--soft); }
.segmini button.on { background: var(--navy); color: var(--banner-ink); }
:root[data-theme="dark"] .segmini button.on { background: var(--gold); color: #1D2536; }
.mlist { max-height: 58vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.mg-h { position: sticky; top: 0; background: var(--panel2); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink); padding: 6px 12px; border-bottom: 1px solid var(--line); z-index: 1; }
.mrow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-bottom: 1px solid var(--line2); }
.mr-main { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.mr-main details { width: 100%; }
.mr-main summary { font-size: .74rem; color: var(--soft); cursor: pointer; }
.mr-main pre { white-space: pre-wrap; font-size: .78rem; background: var(--field); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; margin: 4px 0 0; }
.copybtn { min-width: 84px; }
.chgbtn { border: 1.5px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: .84rem; display: inline-flex; gap: 6px; align-items: center; }
.chgbtn b { background: var(--line2); border-radius: 999px; padding: 0 7px; font-size: .78rem; }
.chgbtn.on { background: var(--gold); border-color: var(--gold); color: #1D2536; }
.chgbtn.on b { background: rgba(255,255,255,.55); }
.chg { font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--red); border-radius: 999px; padding: 1px 7px; }
.mrow.changed { background: var(--gold-soft); }
html.mobile .chgbtn { min-height: 40px; }
.copybtn.done { background: var(--green); border-color: var(--green); color: #fff; }
/* inventory */
.inv-panel h2 .worth { font-size: .78rem; color: var(--soft); text-transform: none; letter-spacing: 0; font-weight: 400; margin-right: 8px; }
.purse { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.cn { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 3px 4px 3px 8px; }
.cn .cdot { width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.cn.cp .cdot { background: #B87333; } .cn.sp .cdot { background: #C9CED6; } .cn.ep .cdot { background: #CDBB78; } .cn.gp .cdot { background: #E0A526; } .cn.pp .cdot { background: #E4ECF2; border: 1px solid #A9B6C2; }
.cn .cl { font-size: .7rem; font-weight: 700; color: var(--soft); margin-right: 2px; }
.cn button { border: 0; background: transparent; color: var(--soft); width: 22px; height: 22px; border-radius: 50%; font-weight: 700; padding: 0; }
.cn button:hover { background: var(--panel); color: var(--ink); }
.cn .f.cin { width: 52px; text-align: center; font-weight: 700; padding: 1px 0; border-bottom-color: transparent; }
.cn.gp { border-color: var(--gold); background: var(--gold-soft); }
.inv-col { padding: 0; overflow: hidden; background: var(--panel); }
.subh { margin: 0; padding: 8px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); font-size: .85rem; letter-spacing: .02em; }
.inv-col.eqcol .subh { background: var(--gold-soft); border-bottom-color: var(--gold); }
.sh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.sh-dot.pack { background: var(--slate); }
.ilist { padding: 2px 0; }
.ilist .hint { padding: 8px 12px; margin: 0; }
.irow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 0 6px; align-items: center; padding: 5px 8px 5px 12px; border-bottom: 1px solid var(--line2); }
.irow:last-child { border-bottom: 0; }
.irow:hover { background: var(--panel2); }
.irow .f.iname { font-weight: 700; padding: 1px 4px; border-bottom-color: transparent; }
.irow .f.inote { grid-column: 1 / -1; font-size: .8rem; color: var(--soft); padding: 0 4px; border-bottom-color: transparent; }

.irow .f:hover { border-bottom-color: var(--line); }
.qty { border-radius: 999px; }
.qty button { width: 22px; height: 22px; background: transparent; color: var(--soft); }
.qty button:hover { color: var(--ink); background: var(--panel2); }
.qty .f.qtyin { width: 30px; font-weight: 700; font-size: .88rem; }
.mvbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: .74rem; font-weight: 700; color: var(--soft); white-space: nowrap; }
.mvbtn.eq { color: var(--gold-ink); border-color: var(--gold); }
.mvbtn:hover { background: var(--gold-soft); color: var(--gold-ink); }
.irow .icon-btn { padding: 2px 5px; font-size: .85rem; }

/* ---------- Phone layout (toggled by the Phone button) ---------- */
html.mobile .inv2, html.mobile .detail-grid { grid-template-columns: 1fr; }
html.mobile .detail-grid { grid-template-columns: 1fr 1fr; }
html.mobile input.f, html.mobile select.f, html.mobile textarea.f { font-size: 16px; }

  if (!/^[\d+\-*/().\s a-z]*$/.test(e)) return null;
  const vars = { level: L, lvl: L, prof: PB(), pb: PB() };
  AB.forEach(a => vars[a] = mod(a));
  const src = e.replace(/[a-z]+/g, w => (w in vars ? '(' + vars[w] + ')' : 'NaN'));
  try { const v = Function('"use strict";return (' + src + ')')(); return isFinite(v) ? Math.max(0, Math.floor(v)) : null; } catch (x) { return null; }
}
const fxActive = () => (S.effects || []).filter(e => !e.conc || e.name === S.concentration);
function parseDur(d) {
  d = String(d || '').toLowerCase();
  if (/instant/.test(d)) return 0;
  const m = d.match(/(\d+)\s*(round|minute|min|hour|day)/);
  if (!m) return /until|special|permanent/.test(d) ? null : 0;
  const n = N(m[1]), u = m[2];
  return u === 'round' ? n : u.startsWith('min') ? n * 10 : u === 'hour' ? n * 600 : n * 14400;
}
function fmtRounds(r) {
  if (r == null) return '∞';
  if (r <= 10) return r + (r === 1 ? ' round' : ' rounds');
  if (r < 600) return Math.ceil(r / 10) + ' min';
  const h = r / 600; return (h >= 10 ? Math.round(h) : Math.round(h * 10) / 10) + ' h';
}

function passRounds(n, why) {
  const ended = [], warn = [];
  (S.effects || []).forEach(e => {
    if (e.rounds == null) return;
    e.rounds = Math.max(0, N(e.rounds) - n);
    if (e.rounds === 0) ended.push(e); else if (e.rounds === 1 && n === 1) warn.push(e);

}

// ---------- Dice ----------
function rollExpr(expr) {
  const clean = String(expr).replace(/\s+/g, '').replace(/−/g, '-');
  const re = /([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/gi;
  let m, total = 0, parts = [], d20 = null;
  while ((m = re.exec(clean))) {
    if (m[3]) {
      const sign = m[1] === '-' ? -1 : 1, n = N(m[2]) || 1, sides = N(m[3]);
      const rs = []; for (let i = 0; i < Math.min(n, 100); i++) rs.push(1 + Math.floor(Math.random() * sides));
      if (sides === 20 && n === 1) d20 = rs[0];
      total += sign * rs.reduce((a, b) => a + b, 0);
      parts.push((sign < 0 ? '− ' : '') + n + 'd' + sides + ' [' + rs.join(', ') + ']');
    } else if (m[5]) {
      const sign = m[4] === '-' ? -1 : 1; total += sign * N(m[5]); parts.push((sign < 0 ? '− ' : '+ ') + m[5]);
    }
  }
  return { total, detail: parts.join(' '), d20 };
}
function roll(label, expr) {
  const r = rollExpr(expr);
  toast(`<b class="total">${r.total}</b><div><div>${esc(label)}</div><div class="det">${esc(r.detail)}</div></div>`, r.d20 === 20 ? 'crit' : r.d20 === 1 ? 'fumble' : '');
  return r;
}
const d20 = (label, bonus) => roll(label, '1d20' + (bonus >= 0 ? '+' : '') + bonus);

function toast(html, cls = '', ms = 4500, action) {

  const box = $('#toasts'); box.appendChild(t);

  const cap = document.documentElement.classList.contains('mobile') ? 2 : 5;

}

function featPips(i) {
  const f = S.features[i], max = evalMax(f.max);
  if (max == null) return '';
  const left = Math.max(0, max - N(f.used));
  if (f.pool || max > 12) return `<span class="pool"><input class="f" data-pool="${i}" type="number" inputmode="numeric" value="${left}" aria-label="${esc(f.name)} remaining"> / ${max}</span>`;
  let h = ''; for (let j = 0; j < max; j++) h += `<button class="pip${j < left ? '' : ' spent'}" data-pip="feat" data-i="${i}" data-j="${j}" aria-label="${esc(f.name)} use ${j + 1}"></button>`;
  return h;
}

const COLS = [['action', 'Action'], ['bonus', 'Bonus Action'], ['reaction', 'Reaction'], ['move', 'Movement & Free']];
const canAttack = () => { const n = N(S.turn.attacks); return n < attacksPerAction() && !(S.turn.used.action && n === 0); };
const featByName = n => S.features.findIndex(f => String(f.name).trim().toLowerCase() === String(n || '').trim().toLowerCase());
const attacksPerAction = () => (/paladin|fighter|ranger|barbarian|monk/i.test(S.cls || '') && lvl() >= 5 ? 2 : 1);
const speedFt = () => parseInt(String(S.speed).replace(/\D+/g, '')) || 30;
function castCol(t) { t = String(t || '').toLowerCase(); if (/bonus/.test(t)) return 'bonus'; if (/reaction/.test(t)) return 'reaction'; if (/^\s*1?\s*action/.test(t)) return 'action'; return null; }
function spellsFor(col) {
  return S.spells.map((sp, i) => [sp, i]).filter(([sp]) => (sp.prepared || sp.oath) && castCol(sp.time) === col)
    .sort((x, y) => N(x[0].level) - N(y[0].level) || String(x[0].name).localeCompare(y[0].name));
}
function smiteHTML() {
  let h = '';
  for (let i = 0; i < 9; i++) {
    const m = slotMax(i); if (!m) continue;
    const left = m - Math.min(N(S.slotsUsed[i]), m), dice = Math.min(5, i + 2) + (UI.smiteUndead ? 1 : 0);
    h += `<button class="smite-btn" data-act="smite" data-l="${i}" ${left ? '' : 'disabled'} title="Spend a ${ORD[i]}-level slot (${left} left)"><b>${Math.min(6, dice)}d8</b><span>${ORD[i]} slot</span></button>`;
  }
  return h || '<span class="hint">No slots</span>';
}

function doPip(p) {

function castSpell(i, col) {

  S.slotsUsed[L - 1] = N(S.slotsUsed[L - 1]) + 1;

  if (rounds !== 0 || acb || s.conc) S.effects = (S.effects || []).filter(x => x.name !== s.name).concat([{ name: s.name, ac: acb, conc: !!s.conc, rounds: rounds === 0 ? null : rounds, slot: L }]);
  update();
  const acts = [{ label: 'Undo', fn: () => undo(1) }];
  const up = avail.find(x => x > L);
  if (up) acts.unshift({ label: `Use ${ORD[up - 1]} slot`, fn: () => { pendingLabel = `${s.name}: upcast to ${ORD[up - 1]}`; S.slotsUsed[L - 1] = Math.max(0, N(S.slotsUsed[L - 1]) - 1); S.slotsUsed[up - 1] = N(S.slotsUsed[up - 1]) + 1; const e = (S.effects || []).find(x => x.name === s.name); if (e) e.slot = up; update(); toast(`${esc(s.name)} now uses a ${ORD[up - 1]}-level slot.`); } });
  if (acb) acts.unshift({ label: 'On an ally', fn: () => { pendingLabel = s.name + ' on an ally'; const e = (S.effects || []).find(x => x.name === s.name); if (e) { e.ac = 0; e.ally = true; } update(); toast(`${esc(s.name)} is on an ally; Zeke's AC stays ${acTotal()}.`); } });

// ---------- Roll20 macros ----------
let MACROS = [];
const sgn = n => (n >= 0 ? '+' : '') + n;
const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
let MACRO_MODE = 'normal';
const TRACK_EXTRA = ['macroSeen'];

    M('Attacks', a.name, `attacks with ${a.name}`, [`**Attack Roll (to hit):** [[${d20x(atkHit(a))}]]`, `**Damage (${dmg}):** [[${dmg}]]`], `${sgn(atkHit(a))} to hit · ${dmg}${a.type ? ' ' + a.type.toLowerCase() : ''}`);
  });

  }

    const lines = [], dice = diceFrom(sp.effect), heal = /heal/i.test(sp.type || '') || /heal|hp/i.test(sp.effect || '') && !/temp/i.test(sp.effect || '');

  const hd = '1d' + (N(S.hitDie) || 10) + sgn(mod('con'));
  M('Other', 'Hit Die', 'spends a Hit Die', [`**Hit Die (${hd}):** [[${hd}]]`], hd);
  M('Other', 'Death Save', 'makes a death saving throw', [`**Death Save:** [[1d20]]`], 'd20');
  AB.forEach(a => M('Ability Checks', ABN[a], `makes ${an(ABN[a])} check`, [`**${ABN[a]} Check:** [[${d20x(mod(a))}]]`], sgn(mod(a))));
  AB.forEach(a => M('Saving Throws', ABN[a] + ' Save', `makes ${an(ABN[a])} saving throw`, [`**${ABN[a]} Save:** [[${d20x(saveVal(a))}]]`], sgn(saveVal(a))));

}

    <p style="margin-bottom:4px"><b>What changes</b></p>
    <ul>${changes.map(c => '<li>' + c + '</li>').join('') || '<li>Hit Dice and max HP</li>'}<li>+1 Hit Die (d${N(S.hitDie)})</li></ul>
    <div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="confirm-level">Become Level ${nl}</button></div>`);
}
function finishLevel() {
  const gain = Math.max(1, N($('#lvHP').value));
  const nl = lvl() + 1;
  S.level = nl; S.hp.max = N(S.hp.max) + gain; S.hp.cur = N(S.hp.cur) + gain;
  pendingLabel = `Level up to ${nl}`;
  S.notes.unshift({ date: new Date().toISOString().slice(0, 10), title: `Reached level ${nl}`, text: `+${gain} max HP (now ${S.hp.max}).` });
  closeModal(true); save(); render();
  toast(`<b class="total">${nl}</b><div>${esc(S.name)} reached level ${nl}!<div class="det">Roll20 macros with new numbers are flagged as Changed.</div></div>`, 'crit', 8000, { label: 'Roll20', fn: () => { UI.macroChanged = true; saveUI(); openMacros(); } });
}

// ---------- Files ----------
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const fileBase = () => (S.name || 'character').replace(/[^\w-]+/g, '_') + '_' + new Date().toISOString().slice(0, 10);
function exportJSON() { download(fileBase() + '.json', JSON.stringify(S, null, 1), 'application/json'); toast('Exported data.'); }
function saveHTML() {
  S.savedAt = Date.now();
  const json = JSON.stringify(S).replace(/</g, '\\u003c');
  const open = '<script id="sheet-data" type="application/json">';
  const a = PRISTINE.indexOf(open), b = PRISTINE.indexOf('</' + 'script>', a);
  const out = (PRISTINE.slice(0, a + open.length) + json + PRISTINE.slice(b)).replace(/<html([^>]*?) class="mobile"/, '<html$1');
  download(fileBase() + '_sheet.html', out, 'text/html');
  save();
  toast('Downloaded an updated copy of the sheet.');
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.abilities) throw new Error('not a sheet');
      const prev = S; S = migrate(d); S.id = prev.id; pendingLabel = 'Import data'; save(); render();
      toast('Imported ' + esc(S.name) + '.', '', 7000, { label: 'Undo', fn: () => undo(1) });
    } catch (x) { toast('That file isn’t a character export.', 'fumble'); }
  };
  r.readAsText(f); e.target.value = '';
});
$('#portraitFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const s = 560, c = document.createElement('canvas'); c.width = c.height = s;
    const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
    c.getContext('2d').drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
    S.portrait = c.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(url);
    pendingLabel = 'Change portrait'; save(); renderHeader(); refresh();
  };
  img.src = url; e.target.value = '';
});

loadHist(FROM_LOCAL);
render();
$('#saveState').textContent = 'Auto-saves';
})();
</script>
</body>
